name: Release

# When a push to main changes the version in manifest.json, build the
# .crx/.zip and attach them to a new GitHub release tagged v<version_name>.
# The release tag and file names use "version_name" (free-form, e.g.
# "1.1-rc1"), falling back to "version" when not set.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".DS_Store"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION_NAME=$(jq -r '.version_name // .version // empty' manifest.json)
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "null" ]; then
            echo "::error::Could not read version_name/version from manifest.json"
            exit 1
          fi
          if printf '%s' "$VERSION_NAME" | grep -Eq '[[:space:]]|[/\\:~^?*\[\]]'; then
            echo "::error::version_name '$VERSION_NAME' contains characters not allowed in file names or git tags"
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Check if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          if gh release view "v$VERSION_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION_NAME already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New version $VERSION_NAME detected - building release."
          fi

      - name: Build .crx and .zip
        if: steps.check.outputs.exists == 'false'
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::Missing repository secret CRX_PRIVATE_KEY. Run 'base64 -i extension.pem | pbcopy' locally, then add it under Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          printf '%s' "$CRX_PRIVATE_KEY" | base64 --decode > extension.pem
          make stage
          npx --yes crx3 \
            -p extension.pem \
            -o "dist/anti-debugger-bypass-${VERSION_NAME}.crx" \
            -z "dist/anti-debugger-bypass-${VERSION_NAME}.zip" \
            build/anti-debugger-bypass
          rm -f extension.pem

      - name: Create release and attach artifacts
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: v${{ steps.version.outputs.version_name }}
          generate_release_notes: true
          files: |
            dist/anti-debugger-bypass-${{ steps.version.outputs.version_name }}.crx
            dist/anti-debugger-bypass-${{ steps.version.outputs.version_name }}.zip
